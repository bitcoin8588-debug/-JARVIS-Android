
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "JARVIS-Android-source.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"

      - name: Check source ZIP
        run: |
          test -f JARVIS-Android-source.zip
          unzip -l JARVIS-Android-source.zip

      - name: Extract Android project
        run: |
          unzip -o JARVIS-Android-source.zip
          test -f JARVIS-Android/settings.gradle.kts
          test -f JARVIS-Android/app/build.gradle.kts

      - name: Build APK
        run: gradle -p JARVIS-Android assembleDebug

      - name: Verify APK
        run: |
          test -f JARVIS-Android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh JARVIS-Android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: JARVIS-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
