
name: Build JARVIS V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract JARVIS V2 source ZIP
        run: |
          test -f JARVIS-V2-Complete-Source.zip
          mkdir -p /tmp/jarvis-source
          unzip -q JARVIS-V2-Complete-Source.zip -d /tmp/jarvis-source
          cp -a /tmp/jarvis-source/. "$GITHUB_WORKSPACE/"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V2-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
