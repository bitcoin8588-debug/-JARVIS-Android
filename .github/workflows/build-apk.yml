
name: Build JARVIS V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android source ZIP
        run: |
          ZIP="JARVIS-V2-Complete-Source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found!"
            ls -la
            exit 1
          fi

          mkdir -p extracted

          unzip -o "$ZIP" -d extracted

          if [ ! -f extracted/app/build.gradle.kts ]; then
            echo "ERROR: Android app folder not found in ZIP!"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          cp -a extracted/. "$GITHUB_WORKSPACE/"

          echo "Source extraction successful!"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Gradle
        run: gradle --version

      - name: Build Android APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V2-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
